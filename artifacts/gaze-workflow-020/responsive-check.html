<!doctype html><html lang="en"><meta charset="utf-8"><title>Yuragi 390px responsive QA</title><style>body{font:14px system-ui;margin:12px}iframe{display:block;width:390px;height:844px;border:1px solid #bdced7;margin-top:12px}button{padding:8px;margin:3px}</style><h1>390 × 844 CSS viewport QA</h1><button data-url="http://127.0.0.1:4310/docs?section=eyes&lang=en">English eyes</button><button data-url="http://127.0.0.1:4310/docs?section=skills&lang=ja">Japanese Skill</button><button data-url="http://127.0.0.1:4310/docs?section=api&lang=zh-TW">Chinese API</button><button data-url="mirea-preview/preview.html">Generated preview</button><button id="desktop-sandbox">Desktop sandbox 1280px</button><button id="sandbox-face">Sandbox face / extremes</button><button id="sandbox-prop">Sandbox prop</button><iframe title="390px responsive viewport" src="http://127.0.0.1:4310/docs?section=eyes&lang=en"></iframe><script>for(const b of document.querySelectorAll('button[data-url]'))b.onclick=()=>{const f=document.querySelector('iframe');f.style.width='390px';f.style.transform='';f.src=b.dataset.url};document.querySelector('#desktop-sandbox').onclick=()=>{const f=document.querySelector('iframe');f.style.width='1280px';f.style.transform='scale(.72)';f.style.transformOrigin='top left';f.src='sandbox/index.html'};document.querySelector('#sandbox-face').onclick=()=>{const d=document.querySelector('iframe').contentDocument;d.querySelector('[data-mode=contact]').click();d.querySelector('#view-face').click()};document.querySelector('#sandbox-prop').onclick=()=>document.querySelector('iframe').contentDocument.querySelector('#view-prop').click();</script></html>
